<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JoinFlex | 인증 테스트 (In-Memory)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 25px; border-radius: 15px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .section { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #f1f1f1; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #3182f6; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .status { font-size: 13px; color: #666; margin-top: 10px; text-align: center; }

        /* 초기에는 보이지 않도록 설정 */
        #payBtn, #uploadBtn { display: none; margin-top: 15px; }
        #payBtn { background: #ff9100; }
        #uploadBtn { background: #673ab7; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔐 JoinFlex 인증</h2>

    <div class="section">
        <h3>1. 회원가입</h3>
        <input type="email" id="email" placeholder="이메일">
        <input type="password" id="signupPw" placeholder="비밀번호">
        <input type="text" id="nickname" placeholder="닉네임">
        <button onclick="signup()">가입하기</button>
        <div id="signupStatus" class="status"></div>
    </div>

    <div class="section">
        <h3>2. 로그인</h3>
        <input type="email" id="loginEmail" placeholder="이메일">
        <input type="password" id="loginPw" placeholder="비밀번호">
        <button onclick="login()" style="background: #00c853;">로그인</button>
        <div id="loginStatus" class="status"></div>

        <button id="payBtn" onclick="goToPayment()">결제 테스트 이동 ➔</button>
        <button id="uploadBtn" onclick="goToFileUpload()">파일 업로드 테스트 이동 ➔</button>
    </div>
</div>

<script>
    let accessToken = null;

    async function signup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('signupPw').value;
        const nickname = document.getElementById('nickname').value;

        try {
            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, nickname })
            });
            document.getElementById('signupStatus').innerText = res.ok ? "가입 성공!" : "가입 실패";
        } catch (e) {
            document.getElementById('signupStatus').innerText = "서버 연결 오류";
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPw').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if(res.ok) {
                // 백엔드 SecurityConfig에서 .exposedHeaders("Authorization") 설정이 되어 있어야 읽을 수 있습니다.
                const authHeader = res.headers.get("Authorization");

                if(authHeader) {
                    accessToken = authHeader.replace("Bearer ", "");
                    document.getElementById('loginStatus').innerText = "✅ 로그인 성공 (토큰 저장됨)";

                    // 버튼들을 강제로 보이게 설정
                    document.getElementById('payBtn').style.setProperty('display', 'block', 'important');
                    document.getElementById('uploadBtn').style.setProperty('display', 'block', 'important');

                    console.log("Token acquired:", accessToken);
                } else {
                    document.getElementById('loginStatus').innerText = "⚠️ 로그인 성공했으나 토큰 헤더가 없습니다.";
                }
            } else {
                document.getElementById('loginStatus').innerText = "❌ 로그인 실패 (아이디/비번 확인)";
            }
        } catch (e) {
            document.getElementById('loginStatus').innerText = "❌ 서버 연결 오류";
        }
    }

    function goToPayment() {
        if(!accessToken) return alert("토큰이 없습니다.");
        location.href = `payment-test.html?token=${accessToken}`;
    }

    function goToFileUpload() {
        if(!accessToken) return alert("토큰이 없습니다.");
        location.href = `upload-test.html?token=${accessToken}`;
    }
</script>
</body>
</html>
