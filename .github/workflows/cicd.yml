name: CI/CD

on:
  push:
    branches: [ "prod" ] # prod 브랜치 푸시 시 실행
  pull_request:
    branches: [ "prod" ]

jobs:
  # 1. 테스트 (Backend)
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # 백엔드 폴더에서 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  # 2. 빌드 및 도커 푸시 (Backend)
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod' # prod 브랜치 푸시 시'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend # 백엔드 폴더 기준 빌드
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/joinflix-back:latest
            ${{ secrets.DOCKER_USERNAME }}/joinflix-back:${{ github.sha }}

  # 3. 배포 (EC2)
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~ # docker-compose.yml이 있는 홈 디렉토리로 이동
            
            # 최신 이미지 Pull
            docker pull ${{ secrets.DOCKER_USERNAME }}/joinflix-back:latest
            
            # 컨테이너 재시작 (기본 파일명 docker-compose.yml 사용)
            docker-compose down
            docker-compose up -d
            
            # 불필요한 이미지 정리
            docker image prune -f
